name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Validate manifest JSON
        run: python -m json.tool app.json > /dev/null

      - name: Compile Python sources
        run: python -m compileall -q backend tests

      - name: Run backend and CLI tests
        run: python -m pytest -q

      - name: Smoke-test CLI with an empty data home
        env:
          KIROCREW_HOME: ${{ runner.temp }}/kirocrew
          KIRO_HOME: ${{ runner.temp }}/kiro
        run: |
          mkdir -p "$KIROCREW_HOME" "$KIRO_HOME"
          ./bin/kc-lens "SELECT count(*) AS sessions FROM sessions"

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Verify committed bundle is current
        run: |
          git diff --exit-code -- dist/index.mjs
          test -z "$(git status --short -- dist/index.mjs)"

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
